name: Limpiar historial del compilador
on:
  workflow_run:
    workflows: ['Crear DMG Mi Reforma']
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Borrar ejecucion de compilacion ya publicada
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          echo "Se elimino el run $RUN_ID. El DMG permanece en Releases."
